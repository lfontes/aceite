services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aceite_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aceite_network

  db:
    image: postgres:15-alpine
    container_name: aceite_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aceite}
      POSTGRES_USER: ${DB_USERNAME:-aceite_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aceite_pass}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aceite_user} -d ${DB_DATABASE:-aceite}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aceite_network

volumes:
  pgdata:
    driver: local

networks:
  aceite_network:
    driver: bridge
